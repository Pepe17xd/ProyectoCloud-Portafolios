name: cloudportfolio-local
services:
  dynamodb:
    image: amazon/dynamodb-local:2.5.4
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-data:/data
    depends_on:
      dynamodb-volume-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8000/shell/ >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [cloudportfolio]

  dynamodb-volume-permissions:
    image: amazon/dynamodb-local:2.5.4
    entrypoint: ["sh", "-c"]
    command: ["chown -R 1000:1000 /data"]
    user: "0:0"
    volumes:
      - dynamodb-data:/data
    restart: "no"

  localstack:
    image: localstack/localstack:4.7.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,sns,sqs
      AWS_DEFAULT_REGION: us-east-1
      PERSISTENCE: "1"
      LS_LOG: warn
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks: [cloudportfolio]

volumes:
  dynamodb-data:
  localstack-data:

networks:
  cloudportfolio:
    name: cloudportfolio-local
